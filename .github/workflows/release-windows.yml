name: Release Windows Build

# Pushing a version tag (e.g. v1.0.2) builds the Windows installers and creates a
# GitHub release with them. Manual runs only build artifacts, never publish.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.2). Leave empty to use package.json'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building MyLocalDev $VERSION"

          # Keep package.json in sync with the tag so artifacts and app-update.yml match
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build renderer
        run: npm run build:renderer

      - name: Verify binary download URLs
        run: npm run test:binary-urls

      # Build locally; the release is created explicitly below so the asset list and
      # release notes are deterministic (electron-builder's publisher can race across
      # targets and create duplicate releases).
      - name: Build Windows installers
        run: npx electron-builder --win --publish never

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="release-notes/$VERSION.md"
          ASSETS=$(ls dist/*.exe dist/latest.yml dist/*.blockmap 2>/dev/null)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading artifacts"
            gh release upload "$TAG" $ASSETS --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --title "MyLocalDev $VERSION" --notes-file "$NOTES"
            fi
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" $ASSETS --verify-tag --latest \
              --title "MyLocalDev $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" $ASSETS --verify-tag --latest \
              --title "MyLocalDev $VERSION" --generate-notes
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mylocaldev-windows-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 14
